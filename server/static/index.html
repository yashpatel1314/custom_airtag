<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --hairline: #e1e0d9; --ring: rgba(11,11,11,0.10);
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --hairline: #2c2c2a; --ring: rgba(255,255,255,0.10);
    }
    .leaflet-layer, .leaflet-control-zoom, .leaflet-control-attribution {
      filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink); height: 100vh; display: flex;
  }
  #sidebar {
    width: 320px; min-width: 320px; padding: 16px; overflow-y: auto;
    border-right: 1px solid var(--hairline); display: flex;
    flex-direction: column; gap: 12px;
  }
  #map { flex: 1; background: var(--surface); }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; }
  .filters { display: flex; gap: 6px; }
  .filters button {
    flex: 1; padding: 5px 0; font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 6px; cursor: pointer;
  }
  .filters button.on { border-color: var(--ink-2); color: var(--ink); font-weight: 600; }
  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 10px; padding: 12px; cursor: pointer;
  }
  .card.sel { border-color: var(--ink-2); }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .name { font-weight: 650; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tiles {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px;
  }
  .tile .v {
    font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums;
  }
  .tile .k {
    font-size: 10.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .foot { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  .findbtn {
    margin-top: 10px; width: 100%; padding: 7px 0; font-size: 12.5px;
    font-weight: 600; color: var(--ink); background: var(--surface);
    border: 1px solid var(--ink-2); border-radius: 7px; cursor: pointer;
  }
  /* Find overlay */
  #finder {
    position: fixed; inset: 0; z-index: 9999; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--page); text-align: center; padding: 24px;
  }
  #finder.on { display: flex; }
  #finder .fname { font-size: 15px; color: var(--ink-2); letter-spacing: .04em;
    text-transform: uppercase; }
  #finder .ring {
    width: 260px; height: 260px; border-radius: 50%; margin: 24px 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .4s, box-shadow .4s; background: var(--hairline);
  }
  #finder .prox { font-size: 30px; font-weight: 700; }
  #finder .dbm { font-size: 14px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; margin-top: 6px; }
  #finder .hint { color: var(--muted); font-size: 13px; max-width: 320px;
    margin-top: 8px; }
  #finder .close {
    margin-top: 28px; padding: 9px 22px; font-size: 14px; font-weight: 600;
    color: var(--ink); background: var(--surface); border: 1px solid var(--ink-2);
    border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body data-palette="#2a78d6,#1baf7a,#eda100,#008300,#4a3aa7,#e34948,#e87ba4,#eb6834">
<div id="sidebar">
  <div>
    <h1>Tracker</h1>
    <div class="sub" id="updated">loading…</div>
  </div>
  <div class="filters" id="range">
    <button data-h="6">6 h</button>
    <button data-h="24" class="on">24 h</button>
    <button data-h="168">7 d</button>
  </div>
  <div id="cards"><div class="empty">No pings yet</div></div>
</div>
<div id="map"></div>

<div id="finder">
  <div class="fname" id="f-name">tag</div>
  <div class="ring" id="f-ring"><div>
    <div class="prox" id="f-prox">Searching…</div>
    <div class="dbm" id="f-dbm"></div>
  </div></div>
  <div class="hint" id="f-hint">Walk around slowly — the reading climbs as you
    get closer. Needs the listener running in <b>find mode</b>.</div>
  <button class="close" onclick="closeFinder()">Done</button>
</div>

<script>
const LIGHT = matchMedia("(prefers-color-scheme: light)").matches;
// Fixed categorical order (light/dark variants) — assigned per device, never cycled.
const PAL_LIGHT = ["#2a78d6","#1baf7a","#eda100","#008300","#4a3aa7","#e34948","#e87ba4","#eb6834"];
const PAL_DARK  = ["#3987e5","#199e70","#c98500","#008300","#9085e9","#e66767","#d55181","#d95926"];
const PAL = LIGHT ? PAL_LIGHT : PAL_DARK;
const STALE_S = 45 * 60;   // 3 missed 15-min reports = stale

const map = L.map("map").setView([37.77, -122.42], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap"
}).addTo(map);

let hours = 24, selected = null, fitted = false;
const layers = {};           // device -> {marker, trail}
const colorOf = {};          // device -> palette slot, fixed on first sight
let nextSlot = 0;

document.getElementById("range").addEventListener("click", e => {
  if (!e.target.dataset.h) return;
  hours = +e.target.dataset.h;
  document.querySelectorAll("#range button").forEach(b =>
    b.classList.toggle("on", b === e.target));
  refresh();
});

const battPct = mv => !mv ? null :
  Math.max(0, Math.min(100, Math.round((mv - 3300) / (4200 - 3300) * 100)));
const csqPct = c => (c == null || c === 99) ? null : Math.round(c / 31 * 100);
const rssiPct = r => r == null ? null :
  Math.max(0, Math.min(100, Math.round((r + 100) / 70 * 100)));
const ago = ts => {
  const s = Date.now() / 1000 - ts;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return (s / 3600).toFixed(1) + " h ago";
  return (s / 86400).toFixed(1) + " d ago";
};

async function refresh() {
  let devs;
  try { devs = await (await fetch("/api/devices")).json(); }
  catch { return; }
  document.getElementById("updated").textContent =
    "updated " + new Date().toLocaleTimeString();

  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  if (!devs.length) {
    cards.innerHTML = '<div class="empty">No pings yet</div>';
    return;
  }
  if (selected === null) selected = devs[0].device;

  const bounds = [];
  for (const d of devs) {
    if (!(d.device in colorOf)) colorOf[d.device] = nextSlot++ % PAL.length;
    const color = PAL[colorOf[d.device]];
    const pos = d.fix ? [d.lat, d.lon] :
      d.last_fix ? [d.last_fix.lat, d.last_fix.lon] : null;
    const fresh = Date.now() / 1000 - d.ts < STALE_S;
    const batt = battPct(d.batt_mv), sig = csqPct(d.csq) ?? rssiPct(d.rssi);
    const zone = d.listener ? `at ${d.listener}` : null;
    // Battery: prefer a precise % (our BLE firmware or GPS mV), else the
    // coarse 4-level label, else unknown.
    const BATT_LABEL = { full: "Full", medium: "Med", low: "Low", critical: "Crit" };
    const battPctVal = d.batt_pct != null ? d.batt_pct : batt;  // batt = from mV
    const battText = battPctVal != null ? battPctVal + "%"
                   : d.batt_lvl ? (BATT_LABEL[d.batt_lvl] || d.batt_lvl) : "n/a";
    const battLow = (battPctVal != null && battPctVal < 20)
                    || d.batt_lvl === "low" || d.batt_lvl === "critical";

    // --- card ---
    const el = document.createElement("div");
    el.className = "card" + (d.device === selected ? " sel" : "");
    el.innerHTML = `
      <div class="card-head">
        <div class="swatch" style="background:${color}"></div>
        <div class="name">${d.device}</div>
        <div class="dot" title="${fresh ? "reporting" : "stale"}"
             style="background:${fresh ? "var(--good)" : "var(--muted)"}"></div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="v" style="${battLow ? "color:var(--critical)" : ""}">${battText}</div><div class="k">battery</div></div>
        <div class="tile"><div class="v">${sig ?? "–"}%</div><div class="k">signal</div></div>
        ${d.listener
          ? `<div class="tile"><div class="v" style="font-size:14px">${d.listener}</div><div class="k">zone</div></div>`
          : `<div class="tile"><div class="v">${d.fix ? (d.sats ?? "–") : "no fix"}</div><div class="k">${d.fix ? "sats" : "gps"}</div></div>`}
      </div>
      <div class="foot">${fresh ? "" : "⚠ "}${zone ? zone + " · " : ""}seen ${ago(d.ts)}${d.listener ? "" : (d.fix ? "" : d.last_fix ? " · showing last fix (" + ago(d.last_fix.ts) + ")" : " · no position yet")}</div>
      <button class="findbtn">🔍 Find this</button>`;
    el.querySelector(".findbtn").onclick = e => { e.stopPropagation(); openFinder(d.device); };
    el.onclick = () => { selected = d.device; refresh(); };
    cards.appendChild(el);

    // --- map ---
    if (!pos) continue;
    bounds.push(pos);
    if (!layers[d.device]) {
      layers[d.device] = {
        marker: L.circleMarker(pos, {
          radius: 8, weight: 2, color: LIGHT ? "#fcfcfb" : "#1a1a19",
          fillColor: color, fillOpacity: 1
        }).addTo(map),
        trail: L.polyline([], { color, weight: 2, opacity: 0.75 }).addTo(map)
      };
    }
    const ly = layers[d.device];
    ly.marker.setLatLng(pos);
    ly.marker.bindTooltip(
      `<b>${d.device}</b><br>${batt ?? "–"}% batt · seen ${ago(d.ts)}`);

    if (d.device === selected) {
      const hist = await (await fetch(
        `/api/devices/${encodeURIComponent(d.device)}/history?hours=${hours}`)).json();
      ly.trail.setLatLngs(hist.map(p => [p.lat, p.lon]));
    } else {
      ly.trail.setLatLngs([]);
    }
  }
  if (!fitted && bounds.length) {
    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
    fitted = true;
  }
}

refresh();
setInterval(refresh, 30000);

// ---- Find mode: big proximity meter, polls fast ----
// RSSI -> proximity bucket (nRF52840 at 0 dBm TX). Higher (less negative) = closer.
const PROX = [
  { min: -55, label: "Right here",  color: "#0ca30c", glow: "#0ca30c" },
  { min: -68, label: "Very close",  color: "#1baf7a", glow: "#1baf7a" },
  { min: -80, label: "Nearby",      color: "#eda100", glow: "#eda100" },
  { min: -999, label: "Far / weak", color: "#e34948", glow: "#e34948" },
];
let findTag = null, findTimer = null;

function openFinder(name) {
  findTag = name;
  document.getElementById("f-name").textContent = name;
  document.getElementById("finder").classList.add("on");
  pollFinder();
  findTimer = setInterval(pollFinder, 1500);
}
function closeFinder() {
  clearInterval(findTimer);
  document.getElementById("finder").classList.remove("on");
  findTag = null;
}
async function pollFinder() {
  let devs;
  try { devs = await (await fetch("/api/devices")).json(); } catch { return; }
  const d = devs.find(x => x.device === findTag);
  const ring = document.getElementById("f-ring");
  const prox = document.getElementById("f-prox");
  const dbm = document.getElementById("f-dbm");
  const stale = !d || d.rssi == null || (Date.now() / 1000 - d.ts > 8);
  if (stale) {
    prox.textContent = "Searching…";
    dbm.textContent = d && d.rssi != null ? `last ${d.rssi} dBm, ${ago(d.ts)}` : "";
    ring.style.background = "var(--hairline)";
    ring.style.boxShadow = "none";
    prox.style.color = "var(--ink)";
    return;
  }
  const p = PROX.find(b => d.rssi >= b.min);
  prox.textContent = p.label;
  prox.style.color = p.color;
  dbm.textContent = `${d.rssi} dBm`;
  // ring fills and glows stronger as you close in
  const pct = Math.max(0, Math.min(100, Math.round((d.rssi + 95) / 45 * 100)));
  ring.style.background =
    `radial-gradient(circle, ${p.glow}33 ${pct}%, var(--hairline) ${pct + 1}%)`;
  ring.style.boxShadow = `0 0 ${pct / 2}px ${p.glow}`;
}
</script>
</body>
</html>
